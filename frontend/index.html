<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>油气知识库 RAG 演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">ZZY RAG · OPENSEARCH</p>
        <h1>油气知识库智能问答</h1>
        <p class="subtitle">异步入库 · BM25 + 向量混合召回 · RRF 融合 · 多语言重排</p>
      </div>
      <span id="systemStatus" class="badge pending">正在连接服务</span>
    </header>

    <section class="card upload-card">
      <div>
        <h2>知识文档入库</h2>
        <p>支持 TXT、PDF、DOCX 等格式。文档将在后台解析、分块、向量化并原子激活。</p>
      </div>
      <div class="upload-row">
        <input type="file" id="fileInput">
        <button id="uploadButton">上传并入库</button>
      </div>
      <div id="ingestionStatus" class="status-line">演示知识库：demo-petroleum</div>
      <ul id="documentList" class="document-list"></ul>
    </section>

    <section class="card chat-card">
      <h2>检索问答</h2>
      <div id="messages" class="messages">
        <div class="message assistant">服务就绪后，可上传规程文档，再询问设备编号、操作步骤或安全要求。</div>
      </div>
      <div class="composer">
        <textarea id="userInput" placeholder="例如：PL-127B 泵出现密封泄漏时应该如何处置？"></textarea>
        <button id="submitBtn">发送问题</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
